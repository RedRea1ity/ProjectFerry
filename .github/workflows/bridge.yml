name: bridge

on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - ".github/workflows/bridge.yml"
    tags:
      - "bridge-v*"

permissions:
  contents: write

jobs:
  verify:
    # 秒级门禁：Mixin 注入点签名错一步就要等 20 分钟编译才暴露，这里先拦掉。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Mojang official mappings
        run: |
          mkdir -p .mappings
          curl -sSL -o .mappings/client_mappings.txt \
            https://piston-meta.mojang.com/mc/game/version_manifest_v2.json
          VER=$(python3 -c "import json;print(json.load(open('.mappings/client_mappings.txt'))['versions'][0]['url'])")
          curl -sSL -o .mappings/version.json "$VER"
          URL=$(python3 -c "import json;print(json.load(open('.mappings/version.json'))['downloads']['client_mappings']['url'])")
          curl -sSL -o .mappings/client_mappings.txt "$URL"
          ls -la .mappings/
      - name: Verify mixin injection signatures
        run: python3 bridge/tools/verify_mixin_signatures.py

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.1.1"
      - name: Build bridge jar
        run: gradle build -p bridge --no-daemon
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferrybridge-jar
          path: bridge/build/libs/*.jar
          if-no-files-found: error
      - name: Publish bridge release
        if: startsWith(github.ref, 'refs/tags/bridge-v')
        uses: softprops/action-gh-release@v2
        with:
          files: bridge/build/libs/*.jar
