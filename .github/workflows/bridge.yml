name: bridge

on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - ".github/workflows/bridge.yml"
    tags:
      - "bridge-v*"

permissions:
  contents: write

jobs:
  build:
    # 2026-10-12（L1）：本模组已零 Mixin，原来那个名为 verify 的
    # 「核验 Mixin 注入点签名」作业随之删除 —— 没有注入点了，也就没有签名可核验。
    #
    # 顺带记一笔：那个作业本来就跑不通。它拉完 Mojang mappings 后直接
    # `python3 bridge/tools/verify_mixin_signatures.py`，既不传 argv 也不设
    # MC_MAPPINGS，而脚本默认路径写死在 Windows 的 D:\Temp\...，
    # CI（ubuntu）上必然 [FATAL] mappings 不存在 → 退出码 2 → 整条工作流红。
    # 留着它只会让 main 的桥工作流一直失败，掩盖真正的构建问题。
    #
    # 去 Mixin 之后，「跨版本要验什么」从「字节码注入点签名」变成了
    # 「Forge 事件 API 签名」—— 后者由编译器把关，不需要单独的签名核验作业。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.1.1"
      - name: Build bridge jar
        run: gradle build -p bridge --no-daemon
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferrybridge-jar
          path: bridge/build/libs/*.jar
          if-no-files-found: error
      - name: Publish bridge release
        if: startsWith(github.ref, 'refs/tags/bridge-v')
        uses: softprops/action-gh-release@v2
        with:
          files: bridge/build/libs/*.jar
