plugins {
    id 'eclipse'
    id 'idea'
    // 版本必须钉死，不能用 [6.0,6.2) 动态范围：
    // 动态范围要求 Gradle 向每个仓库拉 maven-metadata.xml 再比对，
    // 走镜像时多仓库的 metadata 会互相干扰，导致插件解析失败。
    id 'net.minecraftforge.gradle' version '6.0.24'
}

version = '1.0.0'
group = 'com.redreality.ferrybridge'

base { archivesName = 'ferrybridge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // 用 official（官方 Mojang 映射）：编译期写可读的 MC 类名 / 方法名。
    // 产物再交给 reobfJar 重混淆成生产环境能链接的名字。
    mappings channel: 'official', version: '1.20.1'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    // 2026-10-12（L1）：这里**曾经**还有三条 compileOnly ——
    //   org.spongepowered:mixin:0.8.5（注解类）+ gson + guava（Mixin AP 的传递依赖）。
    // 本模组已零 Mixin，不需要注解处理器，也就不需要它们。
}

// ───────────────────────────────────────────────────────────────
// 编译配置：只保留最基本的设置。
//
// 2026-10-12（L1）：这里**曾经**有一大坨 Mixin 注解处理器（AP）的配置 ——
//   -AoutRefMapFile / -AdisableOverwriteChecker / -AreobfSrgFile /
//   -AdefaultObfuscationEnv=searge，外加把 gradle/mappings/official_to_srg.srg
//   声明成 compileJava 的输入、以及 doFirst 里那一长串中文报错。
//
// 它们存在的目的只有一个：让 Mixin AP 生成 ferrybridge.refmap.json。
// 没有它，注入点在混淆后的生产环境里找不到目标方法，又因为设了 require = 0
// 被**静默跳过** —— 症状是「游戏正常启动、日志零 ERROR、功能就是不动」，
// 属于「不配就静默坏掉」的那一类，当初查了很久。
//
// 本模组现在零 Mixin（聊天栏 / tooltip 两条替换路径全走 Forge 官方事件），
// refmap 这个概念整个消失：上面那一坨、连同 9 MB 的混淆映射文件一起不再需要。
// 当初为它写的转换脚本（tools/tsrg2_to_srg.py、tools/copy_reobf_mappings.py）
// 保留在 tools/ 里只作历史参考，**不再参与构建**。
//
// 踩坑史见 docs/PLAN_SCALE_UP.md 第 2 节「Mixin 是负债，官方事件是资产」那张表。
// ───────────────────────────────────────────────────────────────
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 打包：manifest 里**不再**有 'MixinConfigs' 这一项。
// 它原让 Forge 启动时去读 ferrybridge.mixins.json；现在配置文件和 mixin 类
// 都不存在了，留着它只会让 Mixin 每次启动去读一个不存在的东西。
// Fabric 版对应的是 fabric.mod.json，与本文件无关。
jar {
    manifest {
        attributes([
            'Specification-Title'   : 'ferrybridge',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'FerryBridge',
            'Implementation-Version': project.version
        ])
    }
    finalizedBy 'reobfJar'

    // 保险：万一将来有重复条目，至少别让 build 直接炸。
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ───────────────────────────────────────────────────────────────
// 已随 L1 一并删除的两个任务（留着它们只会误导后来人）：
//
//   verifyRefmap —— 校验 jar 里的 ferrybridge.refmap.json 非空。
//                   零 Mixin 后这个文件不再产生，任务本身也就无从完成。
//   showAp       —— 打印 annotationProcessorPath，确认 Mixin AP 在跑。
//                   现在压根没有注解处理器了。
// ───────────────────────────────────────────────────────────────
