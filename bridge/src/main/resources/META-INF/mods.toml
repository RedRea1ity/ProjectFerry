modLoader="javafml"
loaderVersion="[47,)"
license="MIT"
issueTrackerURL="https://github.com/RedRea1ity/ProjectFerry/issues"

[[mods]]
modId="ferrybridge"
version="1.0.0"
displayName="摆渡桥 FerryBridge"
authors="红现实"
description='''摆渡计划的 NBT / 硬编码文本显示层桥接：按英文原文精确替换渲染文本，不改存档、不改模组文件，删掉即还原。'''
displayTest="IGNORE_ALL_VERSION"

[[dependencies.ferrybridge]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.ferrybridge]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="CLIENT"

# 这里**刻意没有 [[mixins]] 块**。
# 2026-10-12（L1）：文本替换已全部改走 Forge 官方事件
#   聊天栏   -> ClientChatReceivedEvent（client/FerryBridgeChat）
#   物品tooltip -> ItemTooltipEvent      （client/FerryBridgeTooltip）
# 本模组现在已经**零 Mixin**：没有 mixins.json、没有 refmap、不需要混淆映射。
# 这是跨版本升级成本的关键 —— 事件 API 比字节码注入点稳定得多，
# 也为「按版本预编译桥模板」的规模化路线让开了路（见 docs/PLAN_SCALE_UP.md）。

# 注意：**不要**为了声明「客户端专属」再加第二个 [[mods]] 块。
# 2026-10-10 踩过：重复声明同一个 modId 会让 Forge 在扫描阶段直接报
#     Found duplicate mods: Mod ID: 'ferrybridge'
# 然后 Failed to find system mod: minecraft，游戏完全起不来。
# 客户端专属是靠上面 dependencies 里的 side="CLIENT" 表达的，
# 而 1.20.1 的 mods.toml 压根没有 clientSideOnly 这个字段。
