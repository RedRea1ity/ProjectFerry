/*
 * 最小化 init script —— 只修 EnvironmentChecks 硬编码自检，不碰任何仓库。
 *
 * 用途：判定 ForgeGradle 依赖解析失败到底是"网络/镜像问题"还是"我们改仓库改坏了"。
 * 用法：gradle build -I gradle/minimal.init.gradle
 *
 * 背景：UserDevPlugin.apply() 里 EnvironmentChecks.checkEnvironment() 会硬编码对
 *   https://maven.minecraftforge.net/ 和 https://libraries.minecraft.net/
 * 发 HEAD，走 HttpsURLConnection（默认无超时），不经过 Gradle 仓库体系。
 * 这是"改仓库地址完全无效"的真正原因（5 分钟零输出、CPU 只烧 20 秒的元凶）。
 * 开关由 ENABLE_CERTIFICATE_CHECK 控制。
 *
 * 此外不设任何镜像、不改仓库顺序 —— 标准 MDK 工程该是什么样就什么样。
 */

// ───────────────────────────────────────────────────────────────
// 必须在 **settings 求值之前** 就把网络超时设好。
//
// 2026-10-12 实测补坑：插件解析（build.gradle 的 plugins { id '...' }）发生在
// settings/build 脚本求值阶段，**比 gradle.projectsLoaded 回调早得多**。
// 原先只在 projectsLoaded 里设超时，于是解析插件、连 gradlePluginPortal /
// maven.minecraftforge.net 时用的仍是「无超时」的 HttpsURLConnection ——
// 网络一慢就**静默卡死**：进程活着、日志停在 "Daemon will be stopped at the end
// of the build"、零任务输出，看起来像死了其实是在等一个永远不来的响应。
// 这正是历史上「联网构建跑 10 分钟毫无动静」的机制。
//
// 双保险：init 脚本顶层（先于 settings 执行）+ gradle.beforeSettings 回调。
System.setProperty('net.minecraftforge.gradle.check.certs', 'false')
System.setProperty('sun.net.client.defaultConnectTimeout', '15000')
System.setProperty('sun.net.client.defaultReadTimeout', '15000')

gradle.beforeSettings {
    System.setProperty('net.minecraftforge.gradle.check.certs', 'false')
    System.setProperty('sun.net.client.defaultConnectTimeout', '15000')
    System.setProperty('sun.net.client.defaultReadTimeout', '15000')
}

gradle.projectsLoaded {
    System.setProperty('net.minecraftforge.gradle.check.certs', 'false')
    System.setProperty('sun.net.client.defaultConnectTimeout', '15000')
    System.setProperty('sun.net.client.defaultReadTimeout', '15000')
}

gradle.settingsEvaluated {
    System.setProperty('net.minecraftforge.gradle.check.certs', 'false')
}

gradle.beforeProject {
    System.setProperty('net.minecraftforge.gradle.check.certs', 'false')
}

// ───────────────────────────────────────────────────────────────
// 只做一件事：把本地预置仓库加到最前面。
//
// 为什么需要：ForgeGradle 有一批写死成动态版本的工具依赖
//（ForgeAutoRenamingTool:1.+ / binarypatcher:1.+ / Srg2Source:8.+ /
//  JarCompatibilityChecker:0.1.+ / modlauncher:10.0.+）。
// Gradle 默认把"某动态版本有哪些可选版本"缓存 24 小时，早期某轮解析到了
// 不完整列表后，即使本地已补上 1.1.2 也照样解析不出来。
//
// 而 mirror.init.gradle 之所以不能用：它会replace/remove 仓库、打乱顺序，
// 把ForgeGradle 自己的 artifactural 仓库体系搞坏，导致
//   forge:1.20.1-47.3.0_mapped_official_1.20.1 解析失败。
// 实测：不加任何仓库改动时构建能跑通（反编译产出 173 MB）。
//
// 所以这里只"加"，绝不"改/删/换顺序"。
// 本地预置仓库 = 仓库根下的 .forge-prefetch/m2（由 tools/prefetch-forge-deps.sh 生成）。
// 用相对路径：init script 里 project.uri()/file() 都相对 **项目目录**（= bridge/）解析，
// 所以 ../.forge-prefetch/m2 正好是仓库根下那一份。
// **不要**写 D:/Temp/... —— D:\Temp 是系统临时目录，2026-10-12 被清过一次，
// 整个构建环境（gradle 发行版 + 预置仓库）当场蒸发，构建直接 exit=127。
def LOCAL_M2 = '../.forge-prefetch/m2'

// 关键：必须在 beforeEvaluate 注入，不能用 afterEvaluate。
//
// 现象（2026-10-10 实测）：compileJava 报
//   "Cannot resolve external dependency net.minecraftforge:ForgeAutoRenamingTool:1.+
//    because no repositories are defined"
// 日志里同一个异常在文件最开头就出现了一次，栈是
//   MavenArtifactDownloader._gradle ← JarExec.lambda$new$0 ← <init>
// 说明 ForgeGradle 在**插件 apply 阶段**就触发 JarExec 去下载
// ForgeAutoRenamingTool / binarypatcher / Srg2Source 等一批动态版本工具。
// 而 build.gradle 里没有 repositories{} 块（MDK 靠插件自己注入），
// 于是在它注入之前，这些下载找不到任何仓库 → 解析失败。
//
// afterEvaluate 太晚：那时插件已经尝试下载过了。
// beforeEvaluate 才能保证仓库在插件 apply 前就位。
gradle.beforeProject { project ->
    project.repositories.maven { r ->
        r.name = 'FerryLocal'
        r.url = project.uri(LOCAL_M2)
        r.metadataSources {
            mavenPom()
            artifact()      // Forge 的 fatjar 常常没有 pom，必须开这个
        }
    }
    project.repositories.maven { r ->
        r.name = 'BMCLAPI'
        r.url = project.uri('https://bmclapi2.bangbang93.com/maven')
    }
    project.repositories.maven { r ->
        r.name = 'MinecraftForge'
        r.url = project.uri('https://maven.minecraftforge.net/')
    }
    project.repositories.mavenCentral()

    // ───────────────────────────────────────────────────────────
    // 把 ForgeGradle 写死的动态版本全部钉死到本地已预置的具体版本。
    //
    // 为什么必须做（2026-10-10 21:45 实测踩坑）：
    // ForgeGradle 在插件 apply 阶段就 JarExec 下载一批「动态版本」工具：
    //   ForgeAutoRenamingTool:1.+ / binarypatcher:1.+ / Srg2Source:8.+ /
    //   JarCompatibilityChecker:0.1.+ / modlauncher:10.0.+
    // Gradle 对动态版本「有哪些可选版本」有 24 小时缓存 TTL。TTL 一过，
    // 离线构建就会挂：
    //   Could not resolve all files for configuration
    //   ':mavenDownloader_net.minecraftforge_ForgeAutoRenamingTool_1.+_all_1'
    // 明明本地 m2 里 jar 和 pom 都在，照样解析不出来——因为它要的是
    // 「1.+ 的可选版本列表」，而这个列表得联网拉 maven-metadata.xml。
    //
    // force() 直接跳过列表查询，让版本解析变成确定性的。
    // 下面的版本号**逐一核对过本地 m2 的实际内容**，别凭印象改：
    //   ForgeAutoRenamingTool → 1.1.2
    //   binarypatcher          → 1.1.1
    //   Srg2Source             → 8.2.0
    //   JarCompatibilityChecker→ 0.1.28
    //   modlauncher            → 10.0.9
    project.configurations.all { cfg ->
        cfg.resolutionStrategy.eachDependency { details ->
            def id = details.requested
            if (id.group == 'net.minecraftforge') {
                if (id.name == 'ForgeAutoRenamingTool' && id.version == '1.+') {
                    details.useVersion '1.1.2'
                }
                if (id.name == 'binarypatcher' && id.version == '1.+') {
                    details.useVersion '1.1.1'
                }
                if (id.name == 'Srg2Source' && id.version == '8.+') {
                    details.useVersion '8.2.0'
                }
            }
            if (id.name == 'JarCompatibilityChecker' && id.version == '0.1.+') {
                details.useVersion '0.1.28'
            }
            if (id.name == 'modlauncher' && id.version == '10.0.+') {
                details.useVersion '10.0.9'
            }
        }
    }
}

gradle.allprojects { project ->
    project.afterEvaluate {
        if (!file(LOCAL_M2).exists()) return
        if (project.repositories.findByName('FerryLocal') != null) return
        def local = project.repositories.maven { r ->
            r.name = 'FerryLocal'
            r.url = uri(LOCAL_M2)
            r.metadataSources {
                mavenPom()
                artifact()
            }
        }
        // maven{} 总是加到末尾，这里移到最前——顺序很关键：
        // 本地仓库在最前，动态版本才能立刻在这里解析掉，不去碰网络。
        project.repositories.remove(local)
        project.repositories.addFirst(local)
    }
}