# 反编译 Minecraft 本体是内存大户，2G 会被 OOM kill（表现为"卡住不动"）。
# 本机 15.7 GB 总量，给 Gradle 8 GB，剩下留给系统和 Minecraft 客户端。
org.gradle.jvmargs=-Xmx8G -XX:+UseG1GC
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# 网络超时放大：官方 Forge 源会慢到 20KB/s，默认 30s 超时会误判失败。
# 主解法是 gradle/mirror.init.gradle 换 BMCLAPI 镜像，这里只是兜底。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=1000

# ───────────────────────────────────────────────────────────────
# 关掉 ForgeGradle 的硬编码联网自检（这一条是整个构建能不能跑起来的关键）
#
# UserDevPlugin.apply() 里会调 EnvironmentChecks.checkEnvironment()，
# 后者硬编码对下面两个 URL 发 HEAD 请求：
#     https://maven.minecraftforge.net/
#     https://libraries.minecraft.net/
#
# 它走的是 javax.net.ssl.HttpsURLConnection，**不经过 Gradle 的仓库体系**，
# 所以 init script 里换镜像 / remove 慢速源全都管不到它。
# 而且 HttpsURLConnection 默认无超时 —— 对端 TLS 握手不回应就会永久卡死。
# 实测表现：5 分钟零输出，CPU 只烧 20 秒，一条 ESTABLISHED 连接挂在
# 104.21.58.163（= maven.minecraftforge.net），缓存零增长。
#
# 这个自检由 ENABLE_CERTIFICATE_CHECK 开关控制，对应系统属性：
systemProp.net.minecraftforge.gradle.check.certs=false
#
# 副作用：同时也会跳过该自检里的证书校验，对我们没有影响
# （真正的依赖下载走 Apache HttpClient，有独立的证书校验）。
#
# 兜底：就算还有别的硬编码 HttpURLConnection 卡住，下面这两个 JDK 全局
# 超时也会让它在 15 秒内抛 SocketTimeoutException 而不是无限等待。
# 注意这俩只影响 HttpURLConnection，不影响 Gradle 依赖下载（走 HttpClient）。
systemProp.sun.net.client.defaultConnectTimeout=15000
systemProp.sun.net.client.defaultReadTimeout=15000